<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0E14">
    <!-- Immediate theme initializer: defaults to Dark Mode unless user explicitly selected light -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "light") {
            document.documentElement.classList.remove("dark");
            document.documentElement.classList.add("light");
          } else {
            document.documentElement.classList.add("dark");
            document.documentElement.classList.remove("light");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <!--  primary -->
    <title>COEP Quant Finance Club | Engineering Finance Through Mathematics</title>
    <meta name="description" content="COEP's student-led quantitative finance research and engineering club. Algorithmic trading, derivatives pricing, and financial mathematics." />
    <meta name="author" content="COEP Quant Finance Club" />
 
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="http://coepquantfinance.com/" />
    <meta property="og:title" content="COEP Quant Finance Club | Engineering Finance Through Mathematics" />
    <meta property="og:description" content="COEP's student-led quantitative finance research and engineering club. Algorithmic trading, derivatives pricing, and financial mathematics." />
    <meta property="og:image" content="http://coepquantfinance.com/club-logo.png"/>

    <!-- X (Twitter) -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="http://coepquantfinance.com/" />
    <meta property="twitter:title" content="COEP Quant Finance Club | Engineering Finance Through Mathematics" />
    <meta property="twitter:description" content="COEP's student-led quantitative finance research and engineering club. Algorithmic trading, derivatives pricing, and financial mathematics." />
    <meta property="twitter:image" content="http://coepquantfinance.com/club-logo.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
